# Hardcoded pick-and-place waypoints. Every arm step below is fully
# config-driven: its target AND its planning mode ("joint" vs a straight-line
# Cartesian path). No code changes needed to retune a value or switch a
# step's mode -- just edit this file and relaunch.
#
# All joint angles (joint_positions, pose's roll/pitch/yaw, and the gripper
# open/grasp positions) are in DEGREES here -- matching what you read off
# RViz's Joints tab -- and converted to radians internally by the node.
# Positions/translations (meters) are unaffected.
#
# Step modes:
#   joint              - joint_positions (5 degrees): OMPL joint-space goal.
#                         Robust (only checks joint limits against values you
#                         already verified), but the Cartesian path the
#                         end-effector takes in between is NOT controlled --
#                         it could arc sideways. Use for free-space moves.
#   cartesian_relative - translation [dx, dy, dz] (meters, world frame)
#                         added to the arm's ACTUAL current pose (read via
#                         FK at plan time, not assumed), orientation held
#                         fixed. Straight-line path. Use when the path SHAPE
#                         matters, e.g. withdrawing something from a snug
#                         hole -- a joint-space goal can jam it sideways.
#   cartesian_absolute - pose [x, y, z, roll, pitch, yaw] (meters for xyz,
#                         degrees for rpy, base_frame): straight-line path
#                         to a fixed target. Can fail on IK/reachability the
#                         way a joint target can't (nothing to solve for
#                         there) -- prefer "joint" unless the path shape
#                         specifically matters.
#   stick_spec         - base_xyz_m / tip_xyz_m (meters, base_frame) +
#                         roll_deg: a stick's own physical ends (the
#                         StickSpec of ROS2_IMPLEMENTATION_PLAN.md Sec 8.3),
#                         solved into a joint target by
#                         so_arm_100_kinematics + stick_spec.py (Sec 11
#                         Phase 3) instead of a hand-tuned constant. Tries
#                         base->tip then tip->base automatically before
#                         giving up (Sec 9.6's Wrist_Roll asymmetry), then
#                         plans the result as a joint goal, same as "joint"
#                         mode. See the commented-out example on the
#                         `place` step below.
#
# Tuning workflow:
# 1. For "joint" steps: in RViz's Joints tab, drag to a pose, verify it
#    looks right, read the joint values (degrees) off the sliders, paste
#    directly into joint_positions -- no conversion needed.
# 2. For "cartesian_relative" steps: translation is just how far to move
#    from wherever the arm actually is when that step runs -- tune the
#    distance, not a pose.
# 3. gripper_open_position_deg / gripper_grasp_position_deg: tune
#    empirically -- start slightly open, close further until the jaws just
#    grip the stick without crushing it.

# Wildcard node-name match (`/**:`), NOT a specific node name -- this one
# file is shared by pick_and_place_node, stick_task_server, and tune_grasp
# (three different node names), and a params-file only applies to a node
# whose name matches its top-level key. Learned the hard way 2026-08-02:
# `stick_task_server` silently ran on its own code-fallback defaults
# (stick.pose off by 13cm) because this used to be scoped to
# `pick_and_place_node:` specifically -- see ROS2_IMPLEMENTATION_PLAN.md
# §4 D9. Keep this `/**:` for any future node that reads these names too.
/**:
  ros__parameters:
    base_frame: "base_link"

    stick:
      # base_xyz_m is the PHYSICAL BASE of the fed stick -- where it meets
      # the feeder hole (same convention as StickSpec.base/PlaceStick's
      # target). Fixed regardless of the stick's length: the collision box
      # is built upward from this point (pose_utils.feeder_stick_pose), so
      # a longer or shorter stick still sits with its base in the same
      # real-world spot instead of needing this constant retuned per size.
      # z re-measured 2026-08-02: the feeder hole doesn't sit flush with
      # the ground, it's raised ~10.3mm. NOTE: this only positions the
      # collision box (visualization + approach-phase collision avoidance)
      # -- it does NOT control where the gripper actually grips the stick.
      # That's steps.lower.joint_positions below, a separate hand-tuned
      # constant; retune that (RViz Joints tab) to change grip height.
      base_xyz_m: [0.379, -0.026, 0.0103]
      section_m: [0.0060, 0.0060]   # cross-section (x, y), meters -- shared by all stock so far
      # Used only when there's no per-goal length to read (the standalone
      # demo, tune_grasp) -- stick_task_server uses PickStick.length
      # instead, so a real goal always reflects the true fed stick.
      default_length_m: 0.11

    steps:
      home:
        mode: "joint"
        # Folded rest pose -- matches the SRDF "home" named state.
        joint_positions: [0.0, -99.98, 85.94, 71.62, 90.0]

      pregrasp:
        mode: "joint"
        joint_positions: [-92.0, 30.0, -4.0, -26.0, 90.0]

      lower:
        mode: "joint"
        # gripper open, jaws around the stick
        joint_positions: [-92.5, 52.0, -6.0, -45.0, 90.0]

      lift:
        mode: "cartesian_relative"
        # Straight up in world Z from wherever the arm actually is right
        # after grasping. Must clear the 5mm hole depth with real margin.
        translation: [0.0, 0.0, 0.05]

      place:
        # mode: "joint"
        # joint_positions: [0.0, 68.0, -17.0, -51.0, 90.0]
        # Sec 11 Phase 3's parametric place: switch mode to "stick_spec" and
        # supply a stick's real base/tip (meters, base_frame) instead of a
        # hand-tuned joint_positions -- e.g. to reproduce this exact tuned
        # pose (confirms the computed target lands in the same spot):
          mode: "stick_spec"
          # base_xyz_m: [0.0, -0.4296986138400065, -0.017358569868196]
          # tip_xyz_m:  [0.0, -0.4296986138400065, 0.092641430131804]
          # roll_deg: 0.0
        # Or to place a real stick from a Blender-exported build file, e.g.
        # s_004 from SO100BlenderTest.build.build.build.json:
          base_xyz_m: [-0.047115, -0.372278, 0.0]
          tip_xyz_m:  [-0.050317, -0.372278, 0.109952]
          roll_deg: 0.0

      retreat:
        mode: "joint"
        joint_positions: [0.0, -84.0, 70.0, -78.0, 90.0]

    grasp:
      gripper_open_position_deg: 30.0    # Gripper joint value when open
      # -9.0 deg re-tuned 2026-08-02 (see grasp_verification's comment below
      # for why the earlier -12deg value stopped being valid).
      gripper_grasp_position_deg: -9.0   # Gripper joint value when closed on the stick

    grasp_verification:
      # If true, after closing the gripper the actual settled Gripper joint
      # position is compared against gripper_grasp_position. Stopping short
      # of the commanded value (by more than gap_threshold) means the jaws
      # hit resistance -- decent evidence something is actually between
      # them. Reaching all the way to the commanded value means they likely
      # closed on nothing. On a failed check you're prompted to attach
      # anyway (override), skip attaching, or abort -- it never silently
      # decides for you.
      # If false, skip the check entirely and always attach (pure
      # assumption -- the previous behavior).
      enabled: true
      # Re-tuned 2026-08-02 on the real gripper/stock with
      # so_arm_100_pick_and_place/tune_grasp. The 2026-08-02 D9 fix (this
      # yaml wasn't actually reaching stick_task_server/tune_grasp before
      # that) changed which `lower` pose is actually used, which changed
      # the real grasp geometry -- the previous -12deg/0.0611rad values were
      # tuned under the old, inaccurate pose and stopped being valid (every
      # real grasp was hitting a hard stop around -7deg and stalling out
      # the 15s goal_time_tolerance watchdog well before reaching -12deg).
      # First re-tune at gripper_grasp_position_deg = -9deg used only 2
      # tune_grasp calibration samples per condition (0.0244 rad / ~1.4deg)
      # -- real PickStick runs then showed a WIDER spread than that alone
      # suggested: holding gaps of 1.09/1.35/2.14/2.23 deg (real grasps,
      # visually confirmed) vs. empty gaps of 0.21/0.30/0.39 deg (real
      # empty-jaws PickStick attempts + tune_grasp) -- the empty cluster is
      # tight and consistent, but 1.4 deg was cutting into the low end of
      # real holding attempts, false-negativing genuine grasps. Lowered to
      # 0.0157 rad (~0.9 deg): ~0.5 deg above the empty cluster's worst
      # case, ~0.19 deg below the lowest real holding gap seen so far --
      # still biased toward the holding side (closer to the holding
      # cluster than the empty one) but no longer clipping real grasps.
      # Re-run tune_grasp (several times each, not just once, given how
      # much real-world spread showed up here) if the stock size, gripper,
      # or `lower` pose changes again.
      gap_threshold: 0.0157   # radians (~0.9deg)

    velocity_scaling: 0.4       # raised from 0.2 2026-08-02 once the basic sequence was hardware-proven
    acceleration_scaling: 0.4
    planning_time: 5.0

    # Each step is planned first and previewed in RViz (display_planned_path)
    # before a terminal prompt asks whether to execute it, skip it, or abort
    # the whole run -- lets you check a plan visually before trusting it on
    # real hardware, and step through the sequence one motion at a time.
    # Set to false for an unattended run once everything above is tuned.
    interactive: true
